apiVersion: apps/v1
kind: Deployment
metadata:
    name: hrm-app
    namespace: {{ .Values.namespace }}

spec:
    replicas: 2
    selector:
        matchLabels:
            app: hrm
    template:
        metadata:
            labels:
                app: hrm
        spec:
            serviceAccountName: {{ .Values.serviceAccount.name }}
            containers:
                - name: hrm-app
                  image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  ports:
                    - containerPort: 8080
                  resources:
                    requests:
                      cpu: {{ .Values.resources.requests.cpu }}
                      memory: {{ .Values.resources.requests.memory }}
                    limits:
                      cpu: {{ .Values.resources.limits.cpu }}
                      memory: {{ .Values.resources.limits.memory }}
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                  livenessProbe:
                    httpGet:
                      path: /api/health
                      port: 8080
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  readinessProbe:
                    httpGet:
                      path: /api/health
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  env:
                    - name: GOOGLE_CLOUD_PROJECT
                      value: {{ .Values.project }}
                    - name: DB_HOST
                      value: "127.0.0.1"
                    - name: DB_PORT
                      value: "5432"
                    - name: DB_NAME
                      valueFrom:
                        secretKeyRef:
                          name: hrm-db-secret
                          key: db_name
                    - name: DB_USER
                      valueFrom:
                        secretKeyRef:
                          name: hrm-db-secret
                          key: db_user
                    - name: CLOUD_FUNCTION_URL
                      value: {{ .Values.cloudFunctionUrl }}
                - name: cloud-sql-proxy
                  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
                  args:
                    - "--structured-logs"
                    - "--port=5432"
                    - "{{ .Values.cloudSql.instanceConnectionName }}"
                  securityContext:
                    runAsNonRoot: true
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi

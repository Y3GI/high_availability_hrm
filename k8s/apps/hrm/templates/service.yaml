apiVersion: v1
kind: Service
metadata: 
  name: hrm-service
  namespace: {{ .Values.namespace }}
  annotations:
    cloud.google.com/backend-config: '{"default": "hrm-app-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: hrm
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
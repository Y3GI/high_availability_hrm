apiVersion: v1
kind: Pod
metadata:
  name: emp-9b779896
  namespace: db-engineering
  labels:
    employee-id: "emp-9b779896"
    department: "db-engineering"
    managed-by: "hrm-cloud-function"
spec:
  serviceAccountName: db-engineering-sa
  restartPolicy: Always
  containers:
    - name: workspace
      image: europe-west4-docker.pkg.dev/fluent-fortress-497419-c5/hrm/db-engineering-workspace:latest
      args:
        - --bind-addr=0.0.0.0:8080
        - --base-path=/workspace/emp-9b779896
        - /home/coder
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: emp-9b779896-workspace-secret
              key: password
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: emp-9b779896-workspace
  namespace: db-engineering
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    employee-id: "emp-9b779896"
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emp-9b779896-workspace
  namespace: db-engineering
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "hrm-ingress-ip"
    networking.gke.io/managed-certificates: "emp-9b779896-workspace-cert"
spec:
  rules:
    - host: cs3-hrm-app.duckdns.org
      http:
        paths:
          - path: /workspace/emp-9b779896
            pathType: Prefix
            backend:
              service:
                name: emp-9b779896-workspace
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: emp-9b779896-workspace-cert
  namespace: db-engineering
spec:
  domains:
    - cs3-hrm-app.duckdns.org

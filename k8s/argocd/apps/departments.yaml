apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: department-namespaces
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hrm-platform
  source:
    repoURL: https://github.com/Y3GI/high_availability_hrm
    targetRevision: main
    path: k8s/apps/departments
    directory:
      recurse: true
      exclude: '**/*.yaml.tpl'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
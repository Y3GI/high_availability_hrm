name: Deploy Workflow

on:
    push:
        branches:
            - main
        paths:
            - 'env/**'
            - 'modules/**'
            - 'k8s/argocd/**'
            - 'k8s/apps/**'
    workflow_dispatch:

permissions:
    id-token: write
    contents: write

env:
    GOOGLE_REGION: ${{ vars.GOOGLE_REGION }}
    GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    ENV_NAME: ${{ vars.ENV_NAME }}
    CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}

jobs:
    terraform:
        name: Terragrunt Apply
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ github.workspace }}/env/dev/
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Configure Google Credentials
              uses: google-github-actions/auth@v2.0.0
              with:
                workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
                service_account: ${{ secrets.GOOGLE_SA_EMAIL }}

            - name: Terraform setup
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false

            - name: Setup Terragrunt
              uses: eLco/setup-terragrunt@v1
              with:
                terragrunt_version: "0.55.0"

            - name: Terragrunt plan
              run: terragrunt run-all plan --terragrunt-non-interactive

            - name: Terragrunt apply
              run: terragrunt run-all apply --terragrunt-non-interactive

    push_images:
        name: Push Workspace Images
        runs-on: ubuntu-latest
        needs: [terraform]
        steps:
            - name: Configure Google Credentials
              uses: google-github-actions/auth@v2.0.0
              with:
                workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
                service_account: ${{ secrets.GOOGLE_SA_EMAIL }}

            - name: Push workspace images to Artifact Registry
              run: |
                gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
                for dept in software devops db-engineering; do
                  docker pull codercom/code-server:latest
                  docker tag codercom/code-server:latest \
                    europe-west4-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT }}/hrm/${dept}-workspace:latest
                  docker push \
                    europe-west4-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT }}/hrm/${dept}-workspace:latest
                done

    configure_cluster:
        name: Configure Cluster
        runs-on: ubuntu-latest
        needs: [terraform]
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Configure Google Credentials
              uses: google-github-actions/auth@v2.0.0
              with:
                workload_identity_provider: ${{ secrets.GOOGLE_WIF_PROVIDER }}
                service_account: ${{ secrets.GOOGLE_SA_EMAIL }}

            - name: Terraform setup
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false

            - name: Setup Terragrunt
              uses: eLco/setup-terragrunt@v1
              with:
                terragrunt_version: "0.55.0"

            - name: Get Cluster Credentials
              uses: google-github-actions/get-gke-credentials@v3
              with:
                cluster_name: ${{ vars.CLUSTER_NAME }}
                location: ${{ vars.GOOGLE_REGION }}

            - name: Install ArgoCD
              run: |
                kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
                kubectl apply -n argocd \
                  -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.0/manifests/install.yaml
                kubectl wait --for=condition=available deployment/argocd-server \
                  -n argocd --timeout=300s

            - name: Apply ArgoCD configs
              run: |
                kubectl apply -f ${{ github.workspace }}/k8s/argocd/project.yaml
                kubectl apply -f ${{ github.workspace }}/k8s/argocd/apps/

            - name: Get Terraform outputs
              id: tf_outputs
              working-directory: ${{ github.workspace }}/env/dev/security
              run: |
                echo "app_sa_email=$(terragrunt output -raw app_sa_email)" >> $GITHUB_OUTPUT
                echo "instance_connection_name=$(terragrunt output -raw instance_connection_name --terragrunt-working-dir ${{ github.workspace }}/env/dev/storage)" >> $GITHUB_OUTPUT
                echo "cloud_function_url=$(terragrunt output -raw function_url --terragrunt-working-dir ${{ github.workspace }}/env/dev/functions)" >> $GITHUB_OUTPUT

            - name: Generate Helm values
              run: |
                export APP_SA_EMAIL=${{ steps.tf_outputs.outputs.app_sa_email }}
                export INSTANCE_CONNECTION_NAME=${{ steps.tf_outputs.outputs.instance_connection_name }}
                export GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT }}
                export CLOUD_FUNCTION_URL=${{ steps.tf_outputs.outputs.cloud_function_url }}
                export IMAGE_TAG=${{ github.sha }}
                envsubst < ${{ github.workspace }}/k8s/apps/hrm/values.yaml.tpl \
                        > ${{ github.workspace }}/k8s/apps/hrm/values.yaml

            - name: Generate department service accounts
              run: |
                export GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT }}
                export ENV=${{ vars.ENV_NAME }}
                for dept in software devops db-engineering; do
                  envsubst < ${{ github.workspace }}/k8s/apps/departments/$dept/serviceaccount.yaml.tpl \
                          > ${{ github.workspace }}/k8s/apps/departments/$dept/serviceaccount.yaml
                done

            - name: Create IAP secret
              run: |
                kubectl create namespace hrm --dry-run=client -o yaml | kubectl apply -f -
                kubectl create secret generic iap-oauth-secret \
                  --from-literal=client_id=${{ secrets.IAP_CLIENT_ID }} \
                  --from-literal=client_secret=${{ secrets.IAP_CLIENT_SECRET }} \
                  --namespace hrm \
                  --dry-run=client -o yaml | kubectl apply -f -

            - name: Create DB secret
              working-directory: ${{ github.workspace }}/env/dev/storage
              run: |
                DB_NAME=$(terragrunt output -raw db_name)
                DB_USER=$(terragrunt output -raw db_user)
                kubectl create secret generic hrm-db-secret \
                  --from-literal=db_name=$DB_NAME \
                  --from-literal=db_user=$DB_USER \
                  --namespace hrm \
                  --dry-run=client -o yaml | kubectl apply -f -

            - name: Commit generated manifests
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add ${{ github.workspace }}/k8s/apps/hrm/values.yaml \
                        ${{ github.workspace }}/k8s/apps/departments/software/serviceaccount.yaml \
                        ${{ github.workspace }}/k8s/apps/departments/devops/serviceaccount.yaml \
                        ${{ github.workspace }}/k8s/apps/departments/db-engineering/serviceaccount.yaml
                git diff --staged --quiet || (
                  git commit -m "chore: update generated manifests [skip ci]"
                  git push
                )
